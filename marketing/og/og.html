<!doctype html>
<!-- Template for public/og/<lang>.png (1200×630). screenshots/assets.mjs serves this next to public/ and fills #t / #d per language. -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="/site.css">
<style>
html,body{width:1200px;height:630px;overflow:hidden}
.og{position:relative;height:630px;padding:72px 80px;display:flex;flex-direction:column;justify-content:space-between}
.og .home{font-size:1.9rem;gap:14px}.og .mark{width:44px;height:44px;border-radius:12px}.og .mark svg{width:26px;height:26px}
.og h1{font-size:112px;line-height:1}
.og p{font-size:30px;color:var(--ink-2);max-width:26em;line-height:1.35;margin-top:28px}
.og .url{position:absolute;right:80px;top:84px;font-family:var(--font-mono);font-size:22px;color:var(--ink-3)}
</style></head><body>
<div class="field" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="og">
 <span class="home"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></span>BackDown</span>
 <span class="url">backdown.io</span>
 <div><h1 id="t">Backup that <em>thinks.</em></h1><p id="d">Find out what's on your drives, what's duplicated, and which ones are safe to wipe, with a hash behind every claim.</p></div>
</div>
</body></html>
