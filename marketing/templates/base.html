<!doctype html>
<html lang="{{@lang}}" data-page="{{@page_id}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{@title}}</title>
<meta name="description" content="{{@description}}">
<meta name="robots" content="{{@robots}}">
<link rel="canonical" href="{{@url}}">
{{@alternates}}
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#f5f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141317" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:url" content="{{@url}}">
<meta property="og:site_name" content="BackDown">
<meta property="og:locale" content="{{meta.og_locale|attr}}">
{{@og_alternates}}
<meta property="og:title" content="{{@og_title}}">
<meta property="og:description" content="{{@og_description}}">
<meta property="og:image" content="{{@og_image}}">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{@og_image_alt}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{@og_title}}">
<meta name="twitter:description" content="{{@og_description}}">
<meta name="twitter:image" content="{{@og_image}}">
<meta name="twitter:image:alt" content="{{@og_image_alt}}">
{{@analytics}}
<script type="application/ld+json">{{@jsonld}}</script>
<link rel="preload" href="/fonts/bricolage-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/site.css?v={{@asset_v}}">
<script src="/site.js?v={{@asset_v}}" defer></script>
<script type="speculationrules">{"prefetch":[{"where":{"and":[{"href_matches":"/*"},{"not":{"href_matches":"/api/*"}}]},"eagerness":"moderate"}]}</script>
</head>
<body>
<a class="skip" href="#top">{{skip}}</a>
<div class="field" aria-hidden="true"><i></i><i></i><i></i></div>

<header class="hdr"><div class="nav-glass" aria-hidden="true"></div>
 <div class="wrap bar">
  <a href="{{@home}}" class="home"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg></span>BackDown</a>
  <nav aria-label="{{nav.label|attr}}">
   {{@nav}}
   <details class="lang"><summary aria-label="{{lang.label|attr}}: {{lang.name|attr}}">{{@flag}}<span>{{@code}}</span></summary>
    <ul>{{@langmenu}}</ul></details>
   <a href="{{@cta_href}}" class="btn btn-primary sm">{{nav.cta}}</a>
  </nav>
 </div>
 <nav class="tabs" aria-label="{{nav.label|attr}}">{{@nav}}</nav>
</header>

<main id="top">
{{@main}}
</main>

<footer>
 <div class="wrap">
  <div class="foot-brand">
   <a href="{{@home}}" class="home"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg></span>BackDown</a>
   <p>{{@footer_privacy}}</p>
  </div>
  <nav class="foot-nav" aria-label="{{footer.label|attr}}">{{@footer_nav}}</nav>
  <span class="foot-copy">© 2026 BackDown</span>
 </div>
</footer>
</body>
</html>
