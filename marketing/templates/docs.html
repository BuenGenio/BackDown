 <div class="docs{{@docs_wide}}">
  <aside class="docs-side">
   <div class="dsearch" role="search" data-index="{{@docs_index}}" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="search" id="dq" placeholder="Search the docs" aria-label="Search the docs" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="dresults" aria-autocomplete="list">
    <kbd class="dkey" aria-hidden="true">/</kbd>
    <div class="dresults card" id="dresults" role="listbox" aria-label="Search results" hidden></div>
   </div>
   <details class="docs-menu"><summary><span class="dm-l">Docs menu</span><span class="dm-here">{{@docs_here}}</span></summary><nav class="dn" aria-label="Docs">{{@docs_nav}}</nav></details>
   <nav class="dn docs-nav" aria-label="Docs">{{@docs_nav}}</nav>
  </aside>
  <article class="doc">
   <nav aria-label="Breadcrumb"><ol class="crumbs">{{@docs_crumbs}}</ol></nav>
   <h1>{{@docs_title}}{{@docs_badge}}</h1>
   <p class="doc-lede">{{@docs_lede}}</p>
   {{@docs_toc_fold}}
   <div class="doc-body">
{{@docs_body}}
   </div>
   <p class="doc-date">Last updated <time datetime="{{@docs_date}}">{{@docs_date_h}}</time> · <a href="/status/">What's released, and what's next</a></p>
   <nav class="doc-pn" aria-label="Previous and next">{{@docs_pn}}</nav>
  </article>
  {{@docs_toc}}
 </div>
