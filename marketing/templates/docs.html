 <div class="docs{{@docs_wide}}">
  <aside class="docs-side">
   <div class="dsearch" role="search" data-index="{{@docs_index}}" data-none="{{docs.search_none|attr}}" data-copied="{{docs.copied|attr}}" data-select="{{docs.select_and_copy|attr}}" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="search" id="dq" placeholder="{{docs.search_placeholder|attr}}" aria-label="{{docs.search_placeholder|attr}}" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="dresults" aria-autocomplete="list">
    <kbd class="dkey" aria-hidden="true">/</kbd>
    <div class="dresults card" id="dresults" role="listbox" aria-label="{{docs.search_results_aria|attr}}" hidden></div>
   </div>
   <details class="docs-menu"><summary><span class="dm-l">{{docs.menu}}</span><span class="dm-here">{{@docs_here}}</span></summary><nav class="dn" aria-label="{{docs.menu|attr}}">{{@docs_nav}}</nav></details>
   <nav class="dn docs-nav" aria-label="{{docs.menu|attr}}">{{@docs_nav}}</nav>
  </aside>
  <article class="doc">
   <nav aria-label="{{docs.breadcrumb_aria|attr}}"><ol class="crumbs">{{@docs_crumbs}}</ol></nav>
   <h1>{{@docs_title}}{{@docs_badge}}</h1>
   <p class="doc-lede">{{@docs_lede}}</p>
   {{@docs_toc_fold}}
   <div class="doc-body">
{{@docs_body}}
   </div>
   <p class="doc-date">{{docs.last_updated}} <time datetime="{{@docs_date}}">{{@docs_date_h}}</time> · <a href="{{@href.status}}">{{docs.whats_released}}</a></p>
   <nav class="doc-pn" aria-label="{{docs.pn_aria|attr}}">{{@docs_pn}}</nav>
  </article>
  {{@docs_toc}}
 </div>
