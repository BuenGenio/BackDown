<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BackDown</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/dashboard.css">
<link rel="stylesheet" href="/settings.css">
<link rel="stylesheet" href="/vendor/hljs-light.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="/vendor/hljs-dark.css" media="(prefers-color-scheme: dark)">
<script type="module" src="/app.js"></script>
</head>
<body>
<div class="busy" id="busy" hidden role="progressbar" aria-label="Working"><span class="busy-note">Still working: on a big index this can take a while</span></div>
<div class="app" id="app">
 <aside class="sidebar">
  <div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 80 60" fill="currentColor" fill-rule="evenodd"><path d="M1 0H10A1 1 0 0 1 11 1V19.7383A21.5 21.5 0 0 1 40 27.5455A21.5 21.5 0 0 1 69 19.7383V1A1 1 0 0 1 70 0H79A1 1 0 0 1 80 1V38.5A21.5 21.5 0 0 1 40 49.4545A21.5 21.5 0 0 1 0 38.5V1A1 1 0 0 1 1 0ZM32.5 38.5A11 11 0 1 0 10.5 38.5A11 11 0 1 0 32.5 38.5ZM69.5 38.5A11 11 0 1 0 47.5 38.5A11 11 0 1 0 69.5 38.5Z"/></svg></span>backdown</div>
  <button class="place" id="dashboard-btn" type="button"><span class="pi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></span><span class="pn">Dashboard</span></button>
  <div class="side-sec">Drives</div>
  <nav class="places" id="places" aria-label="Indexed drives"></nav>
  <div class="side-sec">Machines</div>
  <nav class="places" id="machines" aria-label="Other machines"></nav>
  <div class="side-sec">Views</div>
  <nav class="places" aria-label="Views">
   <button class="place" id="entities-btn" type="button"><span class="pi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg></span><span class="pn">What's here</span></button>
   <button class="place" id="places-btn" type="button"><span class="pi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></span><span class="pn">Places</span></button>
   <button class="place" id="swarm-btn" type="button"><span class="pi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="18" r="2.5"/><circle cx="19" cy="18" r="2.5"/><path d="M10.8 7.2 6.3 15.8M13.2 7.2l4.5 8.6M7.5 18h9"/></svg></span><span class="pn">Swarm</span></button>
   <button class="place" id="plan-btn" type="button"><span class="pi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6M9 18h4"/></svg></span><span class="pn">Plan</span></button>
   <button class="place" id="wipe-btn" type="button"><span class="pi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></span><span class="pn">Free up</span></button>
   <button class="place" id="rescue-btn" type="button"><span class="pi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="m5.6 5.6 3.6 3.6M14.8 14.8l3.6 3.6M14.8 9.2l3.6-3.6M5.6 18.4l3.6-3.6"/></svg></span><span class="pn">Rescue</span></button>
   <button class="place" id="activity-btn" type="button"><span class="pi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg></span><span class="pn">Activity</span></button>
   <button class="place" id="dupes-btn" type="button"><span class="pi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></span><span class="pn">Duplicates</span></button>
   <button class="place" id="settings-btn" type="button"><span class="pi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span><span class="pn">Settings</span></button>
  </nav>
  <div class="side-foot" id="status"><div id="status-act"></div><div id="status-files"></div></div>
 </aside>

 <main class="main">
  <header class="headerbar">
   <div class="hb-group">
    <button id="home" class="hb-btn header-home" type="button" title="Dashboard" aria-label="Dashboard"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></button>
    <button id="back" class="hb-btn" type="button" title="Back (Alt+←)" aria-label="Back"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
    <button id="fwd" class="hb-btn" type="button" title="Forward (Alt+→)" aria-label="Forward"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
   </div>
   <nav class="pathbar" id="pathbar" aria-label="Location"></nav>
   <div class="searchbox" id="searchbox" hidden>
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search this folder" aria-label="Search this folder" autocomplete="off">
   </div>
   <div class="hb-group">
    <button id="search-btn" class="hb-btn" type="button" title="Search (Ctrl+F)" aria-label="Search" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    <button id="filter-btn" class="hb-btn" type="button" title="Filter by type, size and date" aria-label="Filters" aria-pressed="false" aria-controls="filterbar"><svg viewBox="0 0 24 24"><path d="M4 5h16l-6 7.5V19l-4 1v-7.5z"/></svg></button>
    <button id="sort-btn" class="hb-btn" type="button" title="Sort" aria-label="Sort" aria-haspopup="menu"><svg viewBox="0 0 24 24"><path d="M7 4v16M4 17l3 3 3-3M17 20V4M14 7l3-3 3 3"/></svg></button>
    <div class="seg" role="group" aria-label="View">
     <button id="view-grid" type="button" title="Grid view (Ctrl+1)" aria-label="Grid view" aria-pressed="true"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></button>
     <button id="view-list" type="button" title="List view (Ctrl+2)" aria-label="List view" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
     <button id="view-gallery" type="button" title="Photo gallery (Ctrl+3)" aria-label="Photo gallery" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg></button>
     <button id="view-treemap" type="button" title="Size map (Ctrl+4)" aria-label="Size map" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M12 4v16M12 13h9M3 10h9"/></svg></button>
    </div>
    <button id="info-btn" class="hb-btn" type="button" title="Details (Ctrl+I)" aria-label="Details" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button>
   </div>
  </header>

  <div class="update-banner" id="update-banner" role="status" hidden></div>
  <div class="tabs" id="tabs" role="tablist" aria-label="Tabs" hidden></div>
  <div class="filterbar" id="filterbar" hidden>
   <label>Type <select id="f-type"></select></label>
   <label>Size <select id="f-size"></select></label>
   <label>Modified <select id="f-date"></select></label>
   <label class="chk"><input type="checkbox" id="f-hidden"> Hidden files <kbd>Ctrl+H</kbd></label>
   <span class="f-count" id="f-count"></span>
   <button class="btn sm" id="f-clear" type="button">Clear</button>
  </div>
  <div class="banner" id="banner" hidden></div>
  <div class="banner crit" id="health-banner" role="alert" hidden></div>

  <div class="content">
   <section class="view" id="view" tabindex="0" aria-label="Folder contents"></section>
   <aside class="info" id="info" hidden aria-label="Details"></aside>
  </div>

  <footer class="timebar" id="timebar" hidden>
   <span class="tb-icon" title="Time"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg></span>
   <div class="tb-track">
    <input type="range" id="time" min="0" max="0" step="1" value="0" aria-label="Show this drive as it was at a past scan">
    <div class="tb-ticks" id="ticks" aria-hidden="true"></div>
   </div>
   <span class="tb-label" id="time-label">Now</span>
   <button class="btn sm" id="time-compare" type="button" title="What changed in this folder between two scans">Compare…</button>
   <button class="btn sm" id="time-now" type="button" hidden>Back to now</button>
  </footer>
 </main>
</div>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="v-name">
 <header class="vh">
  <button class="hb-btn" id="v-prev" type="button" title="Previous file (←)" aria-label="Previous file"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
  <button class="hb-btn" id="v-next" type="button" title="Next file (→)" aria-label="Next file"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
  <div class="v-title"><span id="v-name"></span><span class="v-meta" id="v-meta"></span></div>
  <div class="v-tools" id="v-tools"></div>
  <button class="hb-btn" id="v-close" type="button" title="Close (Esc)" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
 </header>
 <div class="vbody" id="vbody"></div>
</div>
</body>
</html>
