[package]
name = "backdown-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
backdown-core = { version = "0.2.0-alpha.1", path = "../backdown-core" }
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive", "env"] }
dunce = "1.0.5"
ed25519-dalek = "2"
getrandom = "0.4.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = "1.0.229"
serde_json = "1.0.151"
similar = "3.2.0"
tiny_http = "0.12.0"

[[bin]]
name = "backdown"
path = "src/main.rs"
