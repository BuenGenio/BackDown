[package]
name = "backdown-viewers"
description = "Read-only looks inside container files for BackDown's browser: spreadsheets, slides, mail and mailboxes, archives, disk images and SQL dumps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
backdown-core = { version = "1.0.0-beta.4", path = "../backdown-core" }
base64 = "0.22"
bzip2 = "0.6"
calamine = "0.36"
deflate64 = "0.1"
flate2 = "1.1"
getrandom = "0.4.3"
lzma-rust2 = { version = "0.21", default-features = false, features = ["std", "xz"] }
mail-parser = { version = "0.11", features = ["full_encoding"] }
quick-xml = "0.41"
ruzstd = "0.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.151"
tar = { version = "0.4", default-features = false }

[dev-dependencies]
dunce = "1.0.5"
lzma-rust2 = { version = "0.21", default-features = false, features = ["std", "xz", "encoder"] }
tempfile = "3.27.0"
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
