# Every push: format, lint and test the Rust workspace on Linux (cheapest runner).
# The full Linux/macOS/Windows matrix runs in release.yml on version tags.
name: ci
on:
  push:
    branches: ['**']
    paths: ['crates/**', 'Cargo.*', '.github/workflows/ci.yml']
  pull_request:
    paths: ['crates/**', 'Cargo.*']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
